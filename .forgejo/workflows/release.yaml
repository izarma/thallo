name: Release

on:
  # Trigger this workflow on a manual workflow dispatch.
  workflow_dispatch:
    inputs:
      version:
        description: "Version number in the format `v1.2.3`"
        required: true
        type: string
      build_for_windows:
        description: "Build for Windows (WARNING: slow!)"
        default: true
        type: boolean
      build_for_linux:
        description: "Build for Linux"
        default: true
        type: boolean
      upload_to_github:
        description: "Upload to GitHub releases"
        default: true
        type: boolean
      deploy_to_itch:
        description: "Deploy to itch.io (if configured)"
        default: true
        type: boolean
      deny_warnings:
        description: "Deny warnings"
        default: false
        type: boolean
  # Trigger this workflow automatically after the CI workflow succeeds.
  push:
    branches: [main]

# Cancel the release workflow when a more recent workflow begins.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

# Configure the release workflow by editing the following values.
env:
  # The base filename of the binary produced by `cargo build`.
  cargo_build_binary_name: thallo

  # The path to the assets directory.
  assets_path: assets

  # The itch.io project to deploy to in the format `user-name/project-name`.
  # There will be no deployment to itch.io if this is commented out.
  itch_page: izarma/thallo

  # The base filename of the binary in the package produced by this workflow.
  # Applies to Windows, macOS, and Linux releases.
  # Defaults to `cargo_build_binary_name` if commented out.
  #app_binary_name: thallo

  # The name of the `.zip` or `.dmg` file produced by this workflow.
  # Defaults to `app_binary_name` if commented out.
  #app_package_name: thallo

  # Before enabling LFS, please take a look at GitHub's documentation for costs and quota limits:
  # <https://docs.github.com/en/repositories/working-with-files/managing-large-files/about-storage-and-bandwidth-usage>
  git_lfs: false

  # Enable these to deploy on every push to `main`.
  # Make sure to set up any enabled targets. Builds will ignore warnings.
  # Warning: If you use private repositories, this will eat through your available worker minutes quickly.
  continuous_deployment_to_itch: true

jobs:
  # Determine the version number for this workflow.
  get-version:
    runs-on: bevy0.18
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Determine version number
        id: version
        # Use the input from workflow dispatch, or fall back to the Cargo.toml version
        run: |
          if [ -n '${{ inputs.version }}' ]; then
            echo "version=${{ inputs.version }}" >> "${GITHUB_OUTPUT}"
          else
            echo "version=$(cargo pkgid | sed 's/.*#//')" >> "${GITHUB_OUTPUT}"
          fi

  # Build and package a release for each platform.
  build:
    needs:
      - get-version
    env:
      version: ${{ needs.get-version.outputs.version }}
      # Avoid rate-limiting. See: <https://github.com/cargo-bins/cargo-binstall/issues/2045>.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            binary_ext: .exe
            package_ext: .zip

          - platform: linux
            package_ext: .zip

    runs-on: bevy0.18
    permissions:
      # Required to create a GitHub release: <https://docs.github.com/en/rest/releases/releases#create-a-release>.
      contents: write
    defaults:
      run:
        shell: bash

    steps:
      - name: Set up environment
        run: |
          # Default values:
          echo "app_binary_name=${app_binary_name:=${{ env.cargo_build_binary_name }}}" >> "${GITHUB_ENV}"
          echo "app_package_name=${app_package_name:=${app_binary_name}}" >> "${GITHUB_ENV}"

          # File paths:
          echo "app=tmp/app/${app_package_name}"'${{ matrix.app_suffix }}' >> "${GITHUB_ENV}"
          echo "package=${app_package_name}-"'${{ matrix.platform }}${{ matrix.package_ext }}' >> "${GITHUB_ENV}"

          # Rustflags:
          RUSTFLAGS='-Zthreads=0'
          if [ '${{ matrix.platform }}' != 'windows' ]; then
            RUSTFLAGS="${RUSTFLAGS:+$RUSTFLAGS }"'-Zshare-generics=y'
          fi
          if [ '${{ inputs.deny_warnings }}' = 'true' ]; then
            RUSTFLAGS="${RUSTFLAGS:+$RUSTFLAGS }"'-Dwarnings'
          fi
          echo "RUSTFLAGS=${RUSTFLAGS}" >> "${GITHUB_ENV}"

          # Check if building for this platform is enabled.
          echo 'is_platform_enabled=${{
            (matrix.platform == 'linux' && (inputs.build_for_linux || (github.event_name == 'push' && env.continuous_deployment_to_itch == 'true'))) ||
            (matrix.platform == 'windows' && (inputs.build_for_windows || (github.event_name == 'push' && env.continuous_deployment_to_itch == 'true')))
          }}' >> "${GITHUB_ENV}"

          # Determine the Rust target based on the platform.
          # Linux and Windows are always built for x86_64 so the published binaries
          # work on the most common desktops. Web uses wasm32.
          case '${{ matrix.platform }}' in
            linux)
              RUST_TARGET="x86_64-unknown-linux-gnu"
              ;;
            windows)
              RUST_TARGET="x86_64-pc-windows-gnu"
              ;;
          esac
          echo "rust_target=${RUST_TARGET}" >> "${GITHUB_ENV}"

          # Detect the host architecture so we know when cross-compilation is required.
          HOST_ARCH=$(uname -m)
          case "$HOST_ARCH" in
            x86_64) HOST_ARCH_RUST="x86_64" ;;
            aarch64) HOST_ARCH_RUST="aarch64" ;;
            *) echo "Unsupported host architecture: $HOST_ARCH"; exit 1 ;;
          esac
          echo "host_arch=${HOST_ARCH_RUST}" >> "${GITHUB_ENV}"
          if [ '${{ matrix.platform }}' = 'linux' ] && [ "$HOST_ARCH_RUST" != 'x86_64' ]; then
            echo "needs_linux_cross=1" >> "${GITHUB_ENV}"
          fi
          if [ '${{ matrix.platform }}' = 'windows' ]; then
            echo "needs_windows_cross=1" >> "${GITHUB_ENV}"
          fi

          # Convenience flags for later steps.
          echo 'is_itch_enabled=${{ (inputs.deploy_to_itch || (github.event_name == 'push' && env.continuous_deployment_to_itch == 'true')) && env.itch_page != '' }}' >> "${GITHUB_ENV}"

      - name: Checkout repository
        if: ${{ env.is_platform_enabled == 'true' }}
        uses: actions/checkout@v4
        with:
          lfs: ${{ env.git_lfs }}

      - name: Restore Rust cache
        if: ${{ env.is_platform_enabled == 'true' }}
        uses: https://github.com/Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.platform }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Prepare output directories
        if: ${{ env.is_platform_enabled == 'true' }}
        run: rm -rf tmp; mkdir -p tmp/binary '${{ env.app }}'

      - name: Configure cross-compilation
        if: ${{ env.is_platform_enabled == 'true' }}
        run: |
          if [ '${{ env.needs_linux_cross }}' = '1' ]; then
            echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=x86_64-linux-gnu-gcc" >> "${GITHUB_ENV}"
            echo "PKG_CONFIG_ALLOW_CROSS=1" >> "${GITHUB_ENV}"
            echo "PKG_CONFIG_LIBDIR=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> "${GITHUB_ENV}"
          fi
          if [ '${{ env.needs_windows_cross }}' = '1' ]; then
            echo "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=x86_64-w64-mingw32-gcc" >> "${GITHUB_ENV}"
            # Point `ffmpeg-sys-next` at the prebuilt Windows FFmpeg (headers,
            # mingw import libs, and runtime DLLs) baked into the CI image.
            echo "FFMPEG_DIR=/opt/ffmpeg-win64" >> "${GITHUB_ENV}"
            if [ ! -f /opt/ffmpeg-win64/include/libavcodec/avcodec.h ]; then
              echo "ERROR: Windows FFmpeg bundle missing from CI image (/opt/ffmpeg-win64)." >&2
              echo "Rebuild and redeploy the CI image (ci-image/build.sh) before building for Windows." >&2
              exit 1
            fi
          fi

      - name: Build and add binaries to app
        if: ${{ env.is_platform_enabled == 'true' }}
        run: |
          target='${{ env.rust_target }}'
          bevy build --locked --release --target="${target}" --features='${{ matrix.features }}'
          mv target/"${target}"/release/'${{ env.cargo_build_binary_name }}${{ matrix.binary_ext }}' tmp/binary/"${target}"'${{ matrix.binary_ext }}'
          mv tmp/binary/*'${{ matrix.binary_ext }}' '${{ env.app }}/${{ env.app_binary_name }}${{ matrix.binary_ext }}'

      - name: Add assets to app
        if: ${{ env.is_platform_enabled == 'true' }}
        run: cp -R ./'${{ env.assets_path }}' '${{ env.app }}' || true # Ignore error if assets folder does not exist.

      - name: Add FFmpeg DLLs to app (Windows)
        if: ${{ env.is_platform_enabled == 'true' && matrix.platform == 'windows' }}
        run: cp /opt/ffmpeg-win64/bin/av*.dll /opt/ffmpeg-win64/bin/sw*.dll '${{ env.app }}/'

      - name: Package app
        if: ${{ env.is_platform_enabled == 'true' }}
        working-directory: tmp/app
        run: zip --recurse-paths '${{ env.package }}' '${{ env.app_package_name }}'

      - name: Cache butler
        if: ${{ env.is_platform_enabled == 'true' && env.is_itch_enabled == 'true' }}
        id: butler-cache
        uses: https://github.com/actions/cache@v4
        with:
          path: butler
          key: butler-${{ runner.os }}-${{ runner.arch }}

      - name: Download butler
        if: ${{ env.is_platform_enabled == 'true' && env.is_itch_enabled == 'true' && steps.butler-cache.outputs.cache-hit != 'true' }}
        run: |
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64) BUTLER_ARCH="linux-amd64" ;;
            aarch64) BUTLER_ARCH="linux-arm64" ;;
            *) echo "Unsupported architecture: $ARCH"; exit 1 ;;
          esac
          curl -L -o butler.zip "https://broth.itch.zone/butler/${BUTLER_ARCH}/LATEST/archive/default"
          unzip butler.zip
          chmod +x butler

      - name: Push to itch.io
        if: ${{ env.is_platform_enabled == 'true' && env.is_itch_enabled == 'true' }}
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_CREDENTIALS }}
        run: |
          chmod +x butler
          ./butler -V
          ./butler push \
            --fix-permissions \
            --userversion='${{ needs.get-version.outputs.version }}' \
            '${{ env.app }}' \
            '${{ env.itch_page }}':'${{ matrix.platform }}'

      - name: Upload package to GitHub release
        if: ${{ env.is_platform_enabled == 'true' && inputs.upload_to_github }}
        uses: https://github.com/svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: tmp/app/${{ env.package }}
          asset_name: ${{ env.package }}
          release_name: ${{ env.version }}
          tag: ${{ env.version }}
          overwrite: true
        continue-on-error: true
