name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  # Reduce compile time and cache size.
  # The nightly toolchain is baked into the oracle-runner image.
  RUSTFLAGS: -Dwarnings -Zshare-generics=y -Zthreads=0
  RUSTDOCFLAGS: -Dwarnings -Zshare-generics=y -Zthreads=0

jobs:
  # Check formatting.
  format:
    name: Format
    runs-on: bevy0.18
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check formatting
        run: cargo fmt --all -- --check

  # Check documentation.
  docs:
    name: Docs
    runs-on: bevy0.18
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Rust cache
        id: cache
        uses: https://github.com/Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: true

      - name: Check documentation
        run: cargo doc --locked --workspace --profile ci --all-features --document-private-items --no-deps

  # Run Clippy lints.
  clippy-lints:
    name: Clippy lints
    runs-on: bevy0.18
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Rust cache
        id: cache
        uses: https://github.com/Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: true

      - name: Run Clippy lints
        run: cargo clippy --locked --workspace --all-targets --profile ci --all-features

  # Run Bevy lints.
  bevy-lints:
    name: Bevy lints
    runs-on: bevy0.18
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Rust cache
        id: cache
        uses: https://github.com/Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: true

      - name: Run Bevy lints
        run: bevy_lint --locked --workspace --all-targets --profile ci --all-features

  # Run tests.
  tests:
    name: Tests
    runs-on: bevy0.18
    timeout-minutes: 70
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The video tests read assets/cutscenes/*.mp4, which are tracked
          # with Git LFS. Without this the checkout only contains the LFS
          # pointer files and ffmpeg fails to decode them.
          lfs: true

      - name: Restore Rust cache
        id: cache
        uses: https://github.com/Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: true

      - name: Run tests
        run: cargo test --locked --workspace --all-targets --profile ci --no-fail-fast
