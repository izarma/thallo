name: Release (macOS)

on:
  # Trigger this workflow on a manual workflow dispatch.
  workflow_dispatch:
    inputs:
      version:
        description: "Version number in the format `v1.2.3`"
        required: true
        type: string
      upload_to_github:
        description: "Upload to GitHub releases"
        default: true
        type: boolean
      deploy_to_itch:
        description: "Deploy to itch.io (if configured)"
        default: true
        type: boolean
      deny_warnings:
        description: "Deny warnings"
        default: false
        type: boolean
  # Trigger this workflow automatically after the CI workflow succeeds.
  push:
    branches: [main]

# Cancel the release workflow when a more recent workflow begins.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

# Configure the release workflow by editing the following values.
env:
  # The base filename of the binary produced by `cargo build`.
  cargo_build_binary_name: thallo

  # The path to the assets directory.
  assets_path: assets

  # The itch.io project to deploy to in the format `user-name/project-name`.
  # There will be no deployment to itch.io if this is commented out.
  itch_page: izarma/thallo

  # The base filename of the binary in the package produced by this workflow.
  # Defaults to `cargo_build_binary_name` if commented out.
  #app_binary_name: thallo

  # The name of the `.app` bundle and `.dmg` file produced by this workflow.
  # Defaults to `app_binary_name` if commented out.
  #app_package_name: thallo

  # The display name of the app produced by this workflow.
  # Defaults to `app_package_name` if commented out.
  #app_display_name: thallo

  # The bundle identifier of the app produced by this workflow.
  # Must contain only A-Z, a-z, 0-9, hyphen, and period.
  app_id: com.izarma.thallo

  # Before enabling LFS, please take a look at GitHub's documentation for costs and quota limits:
  # <https://docs.github.com/en/repositories/working-with-files/managing-large-files/about-storage-and-bandwidth-usage>
  git_lfs: true

  # Enable these to deploy on every push to `main`.
  # Warning: If you use private repositories, this will eat through your available worker minutes quickly.
  continuous_deployment_to_itch: true

jobs:
  # Determine the version number for this workflow.
  get-version:
    runs-on: macos-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          # Match the toolchain baked into the `bevy0.18` Forgejo runner image.
          toolchain: nightly-2026-01-22

      - name: Determine version number
        id: version
        # Use the input from workflow dispatch, or fall back to the Cargo.toml version
        run: |
          if [ -n '${{ inputs.version }}' ]; then
            echo "version=${{ inputs.version }}" >> "${GITHUB_OUTPUT}"
          else
            echo "version=$(cargo pkgid | sed 's/.*#//')" >> "${GITHUB_OUTPUT}"
          fi

  # Build and package a release for macOS.
  build-macos:
    needs:
      - get-version
    env:
      version: ${{ needs.get-version.outputs.version }}
      # Avoid rate-limiting. See: <https://github.com/cargo-bins/cargo-binstall/issues/2045>.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: macos-latest
    timeout-minutes: 180
    permissions:
      # Required to create a GitHub release: <https://docs.github.com/en/rest/releases/releases#create-a-release>.
      contents: write
    steps:
      - name: Set up environment
        run: |
          # Default values:
          echo "app_binary_name=${app_binary_name:=${{ env.cargo_build_binary_name }}}" >> "${GITHUB_ENV}"
          echo "app_package_name=${app_package_name:=${app_binary_name}}" >> "${GITHUB_ENV}"
          echo "app_display_name=${app_display_name:=${app_package_name}}" >> "${GITHUB_ENV}"

          # File paths:
          echo "app_bundle=tmp/app/${app_package_name}.app" >> "${GITHUB_ENV}"
          echo "app=tmp/app/${app_package_name}.app/Contents/MacOS" >> "${GITHUB_ENV}"
          echo "package=${app_package_name}-macos.dmg" >> "${GITHUB_ENV}"

          # Rustflags:
          RUSTFLAGS='-Zthreads=0 -Zshare-generics=y -C link-arg=-Wl,-rpath,@loader_path'
          if [ '${{ inputs.deny_warnings }}' = 'true' ]; then
            RUSTFLAGS="${RUSTFLAGS:+$RUSTFLAGS }"'-Dwarnings'
          fi
          echo "RUSTFLAGS=${RUSTFLAGS}" >> "${GITHUB_ENV}"

          # macOS environment:
          echo 'MACOSX_DEPLOYMENT_TARGET=11.0' >> "${GITHUB_ENV}"
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "${GITHUB_ENV}"

          # Convenience flags for later steps.
          echo 'is_itch_enabled=${{ (inputs.deploy_to_itch || (github.event_name == 'push' && env.continuous_deployment_to_itch == 'true')) && env.itch_page != '' }}' >> "${GITHUB_ENV}"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: ${{ env.git_lfs }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          # Match the toolchain baked into the `bevy0.18` Forgejo runner image.
          toolchain: nightly-2026-01-22
          targets: aarch64-apple-darwin

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-macos
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install macOS build dependencies
        # The `static-ffmpeg` feature builds FFmpeg from source, so we only need
        # the assembler tools here. This produces a self-contained binary that
        # does not depend on the end-user's system FFmpeg.
        run: |
          brew update
          brew install nasm yasm

      - name: Install Bevy CLI
        run: |
          cargo install --git https://github.com/TheBevyFlock/bevy_cli \
            --tag cli-v0.1.0-alpha.2 --locked bevy_cli

      - name: Prepare output directories
        run: rm -rf tmp; mkdir -p '${{ env.app }}'

      - name: Build and add binary to app
        # `bevy build --release` honors `package.metadata.bevy_cli.release`,
        # which disables default features, then we enable `static-ffmpeg`.
        run: |
          bevy build --locked --release --target aarch64-apple-darwin \
            --features static-ffmpeg
          mv target/aarch64-apple-darwin/release/'${{ env.cargo_build_binary_name }}' \
            '${{ env.app }}/${{ env.app_binary_name }}'

      - name: Add assets to app
        run: cp -R ./'${{ env.assets_path }}' '${{ env.app }}' || true

      - name: Add metadata to app
        run: |
          cat >'${{ env.app }}/../Info.plist' <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
            <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleDisplayName</key>
              <string>${{ env.app_display_name }}</string>
              <key>CFBundleExecutable</key>
              <string>${{ env.app_binary_name }}</string>
              <key>CFBundleIdentifier</key>
              <string>${{ env.app_id }}</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>${{ env.app_package_name }}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${{ env.version }}</string>
              <key>CFBundleVersion</key>
              <string>${{ env.version }}</string>
              <key>CFBundleSupportedPlatforms</key>
              <array>
                <string>MacOSX</string>
              </array>
            </dict>
          </plist>
          EOF

      - name: Package app
        working-directory: tmp/app
        run: |
          ln -s /Applications .
          hdiutil create -fs HFS+ -volname '${{ env.app_package_name }}' \
            -srcfolder . '${{ env.package }}'

      - name: Cache butler
        if: ${{ env.is_itch_enabled == 'true' }}
        id: butler-cache
        uses: actions/cache@v4
        with:
          path: butler
          key: butler-${{ runner.os }}-${{ runner.arch }}

      - name: Download butler
        if: ${{ env.is_itch_enabled == 'true' && steps.butler-cache.outputs.cache-hit != 'true' }}
        run: |
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64) BUTLER_ARCH="darwin-amd64" ;;
            arm64) BUTLER_ARCH="darwin-arm64" ;;
            *) echo "Unsupported architecture: $ARCH"; exit 1 ;;
          esac
          curl -L -o butler.zip "https://broth.itch.zone/butler/${BUTLER_ARCH}/LATEST/archive/default"
          unzip butler.zip
          chmod +x butler

      - name: Push to itch.io
        if: ${{ env.is_itch_enabled == 'true' }}
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_CREDENTIALS }}
        run: |
          chmod +x butler
          ./butler -V
          ./butler push \
            --fix-permissions \
            --userversion='${{ needs.get-version.outputs.version }}' \
            '${{ env.app_bundle }}' \
            '${{ env.itch_page }}:macos'

      - name: Upload package to GitHub release
        if: ${{ inputs.upload_to_github }}
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: tmp/app/${{ env.package }}
          asset_name: ${{ env.package }}
          release_name: ${{ env.version }}
          tag: ${{ env.version }}
          overwrite: true
